---
openapi: 3.0.0
info:
  description: GreyNoise is a cybersecurity company that collects and analyzes Internet-wide scan and attack traffic. Use GreyNoise to contextualize existing alerts, filter false-positives, identify compromised devices, and track emerging threats.
  version: "3.0.0"
  title: GreyNoise API
  contact:
    email: hello@greynoise.io
  license:
    name: Proprietary
    url: https://www.greynoise.io/terms
tags:
  - name: Community
    description: Endpoints for the community level users
  - name: IP Lookup
    description: Calls to identify whether or not an IP address is noise, or get more information about a given IP address.
  - name: GNQL
    description: Calls to interface with GNQL (GreyNoise Query Language).
  - name: IP Timeline
    description: |
      Noise data captures internet scanning activity against GreyNoise sensors
      deployed globally.
      The IP Timeline APIs allow temporal analysis and presents the user with a
      view of how this data has changed over the time.
  - name: Recall
    description: |
      Endpoint that are used for retrieving GNQL data over time. Allows users
      to view hourly snapshots of IP activity for IPs that return for any
      GNQL query.
  - name: Utility
    description: |
      Endpoints that are used for checking status or retrieving basic metadata
  - name: CVE
    description: |
      Endpoints that are used for retrieving information about Common Vulnerabilities and Exposures (CVEs).
  - name: Tags
    description: |
      Endpoints for retrieving tag information, metadata, and associated activity data.
  - name: Sessions
    description: |
      Endpoints for querying, analyzing, and exporting raw network session (PCAP)
      data captured by GreyNoise sensors. Use the `scope` parameter to control
      data access (workspace or demo). Required entitlements vary by scope.
  - name: Business Service Intelligence
    description: |
      Endpoints that surface aggregate statistics for the GreyNoise Business Service
      Intelligence catalog (formerly RIOT). Use `date=now` for current information
      or `date=YYYY-MM-DD` for historical information. All BSI
      endpoints require the proper entitlement.
  - name: Blocklists
    description: >
      Endpoints for managing enterprise blocklists. Blocklists are workspace-scoped
      GNQL-driven IP lists that automatically refresh. Requires the Blocklists
      entitlement.
  - name: Threat Briefs
    description: |
      Endpoints for browsing GreyNoise research articles (Threat Briefs) and
      subscribing to them as RSS feeds. Browsing requires workspace-level
      authentication and appropriate entitlements; the community RSS feed is public.
security:
  - APIKeyHeaderAuth: []
paths:
  /v3/community/{ip}:
    get:
      operationId: getCommunityIP
      parameters:
        - '$ref': '#/components/parameters/ip'
      tags:
        - Community
      summary: Community API
      description: |
        The Community API provides community users with a free tool to
        query IPs in the GreyNoise dataset and retrieve a subset of the full
        IP context data returned by the IP Lookup API.
      responses:
        '200':
          description: Query was successful, Community API found either a RIOT or Noise record for submitted IP address.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/CommunityResponse'
        '400':
          description: |
            The IP address submitted is not a valid routable IPv4 address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request is not a valid routable IPv4 address
        '404':
          description: The community API was unable to find a record for the requested IP address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ip:
                    type: string
                    example: 1.2.3.4
                  noise:
                    type: boolean
                    example: false
                  riot:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: IP not observed scanning the internet or contained in RIOT data set.
        '429':
          description: Predefined rate-limit has been reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: string
                    example: unauthenticated
                  rate-limit:
                    type: string
                    example: 100-lookups/day
                  plan_url:
                    type: string
                    example: https://greynoise.io/pricing
                  message:
                    type: string
                    example: >
                      You have hit your daily rate limit of 100 requests per day. Please create a free account or upgrade your plan at https://greynoise.io/pricing.

        '500':
          $ref: '#/components/responses/UnexpectedError'
  /v3/ip/{ip}:
    get:
      tags:
        - IP Lookup
      summary: IP Lookup
      operationId: V3IP
      description: |
        Get more information about a given IP address. Returns time ranges,
        IP metadata (network owner, ASN, reverse DNS pointer, country),
        associated actors, activity tags, and raw port scan and web
        request information.

        Use the `quick` parameter to return a subset of the response fields, for a faster response time.
      parameters:
        - '$ref': '#/components/parameters/ip'
        - in: query
          name: quick
          description: If true, the response will only include the IP address and the classification or trust level.
          required: false
          schema:
            type: boolean
            default: false
        - '$ref': '#/components/parameters/workspaceLabels'
      responses:
        '200':
          description: OK - request successful.
          content:
            application/json:
              schema:
                oneOf:
                  - '$ref': '#/components/schemas/IPResponseV3'
                  - '$ref': '#/components/schemas/QuickIpProfile'
        '206':
          description: |
            Partial content - request partially successful.
            Due to plan limitations, your request only returned a subset of
            fields and/or data. Contact sales@greynoise.io to upgrade your
            plan and unlock full results.
          content:
            application/json:
              schema:
                oneOf:
                  - '$ref': '#/components/schemas/IPResponseV3'
                  - '$ref': '#/components/schemas/QuickIpProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
  /v3/ip:
    post:
      tags:
        - IP Lookup
      summary: IP Lookup - Multi
      operationId: V3MultiIP
      description: |
        Retrieves information about the submitted set of IP addresses
        from the Internet Scanner and Business Service intelligence datasets
        (consolidated response based on subscription entitlements).
        Returns time ranges, IP metadata (network owner, ASN, reverse DNS pointer, country),
        associated actors, tags, raw port scan data, web request information,
        classification and/or trust level, and provider information.

        Use the `quick` parameter to return a subset of the response fields, for a faster response time.

        Can process up to 10,000 IPs per request.
      requestBody:
        '$ref': '#/components/requestBodies/MultiIpRequest'
      parameters:
        - in: query
          name: quick
          description: If true, the response will only include the IP address and the classification or trust level.
          required: false
          schema:
            type: boolean
            default: false
        - '$ref': '#/components/parameters/workspaceLabels'
      responses:
        '200':
          description: OK - request successful.
          content:
            application/json:
              schema:
                oneOf:
                  - '$ref': '#/components/schemas/MultiIPResponseV3'
                  - '$ref': '#/components/schemas/QuickMultiIPResponseV3'
        '206':
          description: |
            Partial content - request partially successful.
            Due to plan limitations, your request only returned a subset of
            fields and/or data. Contact sales@greynoise.io to upgrade your
            plan and unlock full results.
          content:
            application/json:
              schema:
                oneOf:
                  - '$ref': '#/components/schemas/MultiIPResponseV3'
                  - '$ref': '#/components/schemas/QuickMultiIPResponseV3'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
  /v3/gnql:
    get:
      tags:
        - GNQL
      summary: GNQL V3 Query
      operationId: gnqlV3Query
      description: |
        GreyNoise Query Language
        GNQL (GreyNoise Query Language) is a domain-specific query language
        that uses Lucene deep under the hood. GNQL aims to enable GreyNoise
        Enterprise and Research users to make complex and one-off queries
        against the GreyNoise dataset as new business cases arise. GNQL is
        built with self-defeat and fully featured product lines in mind. If
        we do our job correctly, each individual GNQL query that brings our
        users and customers sufficient value will eventually be transitioned
        into it's own individual offering.
        _License: The `business_service_intelligence` response field
        requires the BSI Module. Without it, every result returns an empty
        `business_service_intelligence` object; all other fields are
        returned normally._
        Facets:
        * `ip` - The IP address of the scanning device IP
        * `classification` - Whether the device has been categorized as
        unknown, benign, or malicious
        * `first_seen` - The date the device was first observed by GreyNoise
        * `last_seen` - The date the device was most recently observed
        by GreyNoise
        * `actor` - The benign actor the device has been associated with,
        such as Shodan, Censys, GoogleBot, etc
        * `tags` - A list of the tags the device has been assigned over the
        past 90 days
        * `spoofable` - This IP address has been opportunistically scanning the
        Internet, however has failed to complete a full TCP connection. Any
        reported activity could be spoofed.
        * `vpn` - This IP is associated with a VPN service. Activity, malicious
        or otherwise, should not be attributed to the VPN service provider.
        * `vpn_service` - The VPN service the IP is associated with
        * `tor` - Whether or not the device is a known Tor exit node
        * `cve` - A list of CVEs that the device has been associated with
        * `single_destination` - A boolean parameter that filters source country
        IPs that have only been observed in a single destination country
        * `metadata.category` - Whether the device belongs to a business, isp,
        hosting, education, or mobile network
        * `metadata.carrier` - The Internet Service Provider (ISP) or telecommunications carrier
        associated with the source IP address
        * `metadata.country` - The full name of the country the device is
        geographically located in (This is the same data as
        `metadata.source_country`. `metadata.source_country` is preferred)
        * `metadata.country_code` - The two-character country code of the
        country the device is geographically located in (This is the same data
        as `metadata.source_country_code`. `metadata.source_country_code`
        is preferred)
        * `metadata.datacenter` - The datacenter or hosting provider from which the activity originates.
        This could indicate the use of cloud services, managed hosting,
        or enterprise datacenter infrastructure.
        * `metadata.domain` - The domain name associated with the source IP address
        * `metadata.sensor_hits` - The amount of unique data that has been recorded by the sensor
        * `metadata.sensor_count` - The number of sensors the IP Address has been observed on
        * `metadata.city` - The city the device is geographically located in
        * `metadata.region` - The region the device is geographically located in
        * `metadata.organization` - The organization that owns the network that
        the IP address belongs to
        * `metadata.rdns` - The reverse DNS pointer of the IP
        * `metadata.asn` - The autonomous system the IP address belongs to
        * `metadata.destination_cities` - The city where the GreyNoise sensor is geographically located
        * `metadata.destination_asns` - The ASN associated with the destination IP address
        * `metadata.destination_countries` - The full country name where the GreyNoise
        sensors are physically located
        * `metadata.destination_country_codes` - The country code where the GreyNoise
        sensors are physically located
        * `metadata.destination_country` - The full country name where the GreyNoise
        sensors are physically located
        * `metadata.destination_country_code` - The country code where the GreyNoise
        sensors are physically located
        * `metadata.latitude` - The geographic latitude of the source IP address
        * `metadata.longitude` - The geographic longitude of the source IP address
        * `metadata.rdns_parent` - The parent domain retrieved through reverse DNS (RDNS)
        lookup of the source IP address
        * `metadata.rdns_validated` - A validation status that confirms whether the
        reverse DNS (RDNS) record correctly maps to the source domain
        * `metadata.source_country_code` - The two-character country code of the
        country the device is geographically located in
        * `metadata.source_country` - The full name of the country the device is
        geographically located in
        * `raw_data.scan.port` - The port being targeted on a GreyNoise sensor
        * `raw_data.scan.protocol` - The protocol of the port the device has
        been observed scanning
        * `raw_data.web.paths` - Any HTTP paths the device has been observed
        crawling the Internet for
        * `raw_data.web.useragents` - Any HTTP user-agents the device has been
        observed using while crawling the Internet
        * `raw_data.ja3.fingerprint` - The JA3 TLS/SSL fingerprint
        * `raw_data.ja3.port` - The corresponding TCP port for the given JA3
        fingerprint
        * `raw_data.hassh.fingerprint` - The HASSH fingerprint
        * `raw_data.hassh.port` - The corresponding TCP port for the given HASSH
        fingerprint
        * `raw_data.http.md5` - An MD5 hash of the body content. This compact,
        unique representation of the data allows for quick comparisons and
        deduplication of payloads without storing the raw content.
        * `raw_data.http.cookie_keys` - The keys or names of cookies exchanged in the
        communication. These can reveal session identifiers, tracking mechanisms,
        or other metadata used in web interactions,
        providing clues about application behavior or vulnerabilities.
        * `raw_data.http.request_authorization` - The contents of the Authorization header in a request,
        typically containing authentication credentials or tokens (e.g., Basic Auth, Bearer tokens).
        Analyzing this helps verify authorization mechanisms and detect credential misuse or token abuse.
        * `raw_data.http.request_cookie` - Key-value pairs stored in cookies sent with an HTTP request.
        These cookies often contain session identifiers, user preferences, or tracking data,
        which can be analyzed to detect unauthorized access or manipulation.
        * `raw_data.http.request_header` - Request Headers are the keys (names) of HTTP headers that a
        client sends to a server.
        * `raw_data.http.request_method` - The HTTP method used in the request, such as GET, POST, PUT, or DELETE.
        Analyzing methods can reveal the intent of the request, such as retrieving or modifying resources,
        and identify unexpected or suspicious activity.
        * `raw_data.http.request_origin` - Indicates the origin of the request, typically used in
        cross-origin resource sharing (CORS) to specify where the request originated.
        This helps identify unauthorized or potentially malicious cross-origin requests.
        * `raw_data.tls.cipher` - The encryption algorithm or cipher suite used during
        the secure communication. Identifying the cipher helps assess the
        security of the connection, particularly in TLS/SSL traffic.
        * `raw_data.tls.ja4` - JA4 TLS fingerprint. JA4 captures distinctive
        characteristics of TLS client behavior, useful for identifying and
        clustering malicious or anomalous clients.
        * `raw_data.http.ja4h` - JA4H HTTP client fingerprint. Captures
        characteristics of HTTP client behavior including method, headers,
        and cookie fields, useful for identifying and tracking HTTP clients.
        * `raw_data.ssh.ja4ssh` - JA4SSH fingerprint. Captures SSH traffic
        patterns including packet lengths and directions, useful for
        identifying SSH client behavior and detecting anomalous sessions.
        * `raw_data.tcp.ja4t` - JA4T TCP fingerprint. Captures TCP
        connection characteristics such as window size, options, and MSS,
        useful for OS fingerprinting and identifying network stacks.
        * `raw_data.tcp.ja4l` - JA4L light distance/latency fingerprint.
        Captures TCP TTL and window size characteristics, useful for
        estimating client-server distance and identifying proxied connections.
        Behavior:
        * `raw_data.ssh.key` - This is the SSH key used.
        * You can subtract facets by prefacing the query with a minus character
        * The data that this endpoint queries refreshes once per hour
        Shortcuts:
        * You can find interesting hosts by using the GNQL query term
        `interesting`
        * You can use the keyword `today` in the `first_seen` and
        `last_seen` parameters: `last_seen:today` or `first_seen:today`
        Examples:
        * `last_seen:today` - Returns all IPs scanning/crawling the
        Internet today
        * `tags:Mirai` - Returns all devices with the "Mirai" tag
        * `tags:"RDP Scanner"` - Returns all devices with the "RDP
        Scanner" tag
        * `classification:malicious metadata.country:Belgium`
        - Returns all compromised devices located in Belgium
        * `classification:malicious metadata.rdns:*.gov*` - Returns
        all compromised devices that include .gov in their reverse DNS records
        * `metadata.organization:Microsoft classification:malicious`
        - Returns all compromised devices that belong to Microsoft
        * `(raw_data.scan.port:445 and raw_data.scan.protocol:TCP)
        metadata.os:Windows*` - Return all devices scanning the Internet
        for port 445/TCP running Windows operating systems
        (Conficker/EternalBlue/WannaCry)
        * `raw_data.scan.port:554` - Returns all devices scanning the
        Internet for port 554
        * `-metadata.organization:Google raw_data.web.useragents:GoogleBot`
        - Returns all devices crawling the Internet with "GoogleBot" in
        their useragent from a network that does NOT belong to Google
        * `tags:"Siemens PLC Scanner" -classification:benign` - Returns
        all devices scanning the Internet for SCADA devices who ARE
        NOT tagged by GreyNoise as "benign"
        (Shodan/Project Sonar/Censys/Google/Bing/etc)
        * `classification:benign` - Returns all "good guys" scanning
        the Internet
        * `raw_data.ja3.fingerprint:795bc7ce13f60d61e9ac03611dd36d90`
        - Returns all devices crawling the Internet with a matching
        client JA3 TLS/SSL fingerprint
        * `raw_data.hassh.fingerprint:51cba57125523ce4b9db67714a90bf6e`
        - Returns all devices crawling the Internet with a matching
        client HASSH fingerprint
        * `raw_data.tls.ja4:t13d1516h2_8daaf6152771_02713d6af862`
        - Returns all devices with a matching JA4 TLS fingerprint
        * `raw_data.http.ja4h:ge11cn060000_4e59edc1297a_4da5efaf0cbd`
        - Returns all devices with a matching JA4H HTTP fingerprint
        * `raw_data.ssh.ja4ssh:c76s76_c71s59_c0s0`
        - Returns all devices with a matching JA4SSH fingerprint
        * `raw_data.tcp.ja4t:64240_2-1-3-1-1-4_1460_8`
        - Returns all devices with a matching JA4T TCP fingerprint
        * `raw_data.tcp.ja4l:1460_64`
        - Returns all devices with a matching JA4L light
        distance/latency fingerprint
        * `raw_data.web.paths:"/HNAP1/"` -Returns all devices crawling
        the Internet for the HTTP path "/HNAP1/"
        * `8.0.0.0/8` - Returns all devices scanning the Internet from
        the CIDR block 8.0.0.0/8
        * `cve:CVE-2021-30461` - Returns all devices associated with the
        supplied CVE
        * `source_country:Iran` - Returns all results originating from Iran
        * `destination_country:Ukraine single_destination:true`
        - Returns all results scanning in only Ukraine
      parameters:
        - '$ref': '#/components/parameters/query'
        - in: query
          name: size
          description: The number of results provided per page for paginating through all results of a query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 10000
        - in: query
          name: scroll
          description: Scroll token to paginate through results. Incompatible with `format=csv`.
          required: false
          schema:
            type: string
        - in: query
          name: quick
          description: If true, the response will only include the IP address and the classification or trust level.
          required: false
          schema:
            type: boolean
            default: false
        - in: query
          name: format
          description: Specifies the desired format of the results. Must be either csv or json.
          required: false
          schema:
            type: string
            enum: [csv, json]
            default: json
        - in: query
          name: exclude
          description: |
            Comma-separated list of fields to exclude from the response.
            Recognized top-level response fields (e.g. `tags`, `cves`, `vpn`, `tor`, `raw_data`, `metadata`),
            `metadata.<subfield>` paths (e.g. `metadata.organization`, `metadata.source_country`,
            `metadata.destination_countries`), and `raw_data.<subfield>` paths (e.g. `raw_data.ja3`,
            `raw_data.http.useragent`) are accepted. The special value `tags.details` preserves tag
            identity (id, slug) and strips only the enriched details. Unknown field names return 400.
          required: false
          schema:
            type: string
            example: "metadata.organization,metadata.city,raw_data.ja3"
      responses:
        '200':
          description: OK - request successful.
          content:
            application/json:
              schema:
                oneOf:
                  - '$ref': '#/components/schemas/GNQLV3Response'
                  - '$ref': '#/components/schemas/QuickGNQLV3Response'
        '206':
          description: |
            Partial content - request partially successful.
            Due to plan limitations, your request only returned a subset of
            fields and/or data. Contact sales@greynoise.io to upgrade your
            plan and unlock full results.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/GNQLV3Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
  /v3/gnql/stats:
    get:
      tags:
        - GNQL
      summary: GNQL V3 Stats
      operationId: gnqlV3Stats
      description: |
        Get aggregate statistics for the top organizations, actors, tags,
        ASNs, countries, classifications, and operating systems of all the
        results of a given GNQL query.
      parameters:
        - '$ref': '#/components/parameters/query'
        - in: query
          name: count
          description: Number of top aggregates to grab
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
      responses:
        '200':
          description: Query successful.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/GNQLStats'
        '206':
          description: |
            Partial content - request partially successful.
            Due to plan limitations, your request only returned a subset of
            fields and/or data. The `adjusted_query` field in the response
            indicates how the original query was modified. Contact
            sales@greynoise.io to upgrade your plan and unlock full results.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/GNQLStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
  /v3/gnql/timeseries:
    get:
      tags:
        - Recall
      summary: GNQL V3 Recall
      operationId: gnqlTimeSeries
      description: |
        Get hourly GNQL records for a given time range.
      parameters:
        - '$ref': '#/components/parameters/query'
        - in: query
          name: start
          description: Start date for the desired time range
          required: false
          schema:
            type: string
            format: date-time
          example: "2025-01-01T00:00:00Z"
        - in: query
          name: end
          description: End date for the desired time range
          required: false
          schema:
            type: string
            format: date-time
          example: "2025-01-07T23:59:59Z"
        - in: query
          name: format
          description: Specifies the desired format of the results. Must be either csv or json.
          required: false
          schema:
            type: string
            enum: [csv, json]
            default: json
        - in: query
          name: limit
          description: Specifies the number of records desired from the backend query. For example, if you specify a limit of 100, you will get the first 100 records for your query, divided up by hour.
          required: false
          schema:
            type: integer
        - in: query
          name: offset
          description: Specifies the offset at which to apply the limit. With limit, can be used to paginate through a large response. For example, if you specify a limit of 100 and and an offset of 200, you will get the next 100 records starting at the 200th record.
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Query successful.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/TimeSeriesResponse'
        '206':
          description: |
            Partial content - request partially successful.
            Due to plan limitations, your request only returned a subset of
            fields and/or data. Contact sales@greynoise.io to upgrade your
            plan and unlock full results.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/TimeSeriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/ExceededLimit'
  /v3/gnql/timeseries/stats:
    get:
      tags:
        - Recall
      summary: GNQL V3 Recall Stats
      operationId: gnqlTimeSeriesStats
      description: |
        Get the number of unique IPs that match a GNQL query
        per hour/day over a given time range.
      parameters:
        - '$ref': '#/components/parameters/query'
        - in: query
          name: start
          description: Start date for the desired time range
          required: false
          schema:
            type: string
            format: date-time
          example: "2025-01-01T00:00:00Z"
        - in: query
          name: end
          description: End date for the desired time range
          required: false
          schema:
            type: string
            format: date-time
          example: "2025-01-07T23:59:59Z"
        - in: query
          name: format
          description: Specifies the desired format of the results. Must be either csv or json.
          required: false
          schema:
            type: string
            enum: [csv, json]
            default: json
        - in: query
          name: interval
          description: Specifies the time interval over which to aggregate unique IPs that return the given GNQL query.
          required: true
          schema:
            type: string
            enum: [hour, day]
      responses:
        '200':
          description: Query successful.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/TimeSeriesStatsResponse'
        '206':
          description: |
            Partial content - request partially successful.
            Due to plan limitations, your request only returned a subset of
            fields and/or data. Contact sales@greynoise.io to upgrade your
            plan and unlock full results.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/TimeSeriesStatsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/ExceededLimit'
  /v3/gnql/metadata:
    get:
      tags:
        - GNQL
      summary: GNQL V3 Metadata Query
      operationId: gnqlV3MetadataQuery
      description: |
        GreyNoise Query Language Metadata Endpoint
        This endpoint provides the same functionality as the main GNQL endpoint
        but with additional field filtering capabilities. It automatically excludes
        raw data from responses and allows you to specify additional fields to exclude.

        The metadata endpoint is designed for use cases where you need to retrieve
        IP intelligence data without the raw scan data, making it more efficient
        for metadata-focused queries.

        _License: The `business_service_intelligence` response field
        requires the BSI Module. Without it, every result returns an empty
        `business_service_intelligence` object; all other fields are
        returned normally._
      parameters:
        - '$ref': '#/components/parameters/query'
        - in: query
          name: size
          description: The number of results provided per page for paginating through all results of a query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 10000
        - in: query
          name: scroll
          description: Scroll token to paginate through results
          required: false
          schema:
            type: string
        - in: query
          name: quick
          description: If true, the response will only include the IP address and the classification or trust level.
          required: false
          schema:
            type: boolean
            default: false
        - in: query
          name: exclude
          description: |
            Comma-separated list of additional fields to exclude from the response.
            `raw_data` is always excluded by this endpoint; specifying it is redundant.
            Recognized top-level response fields (e.g. `tags`, `cves`, `vpn`, `tor`, `metadata`)
            and `metadata.<subfield>` paths (e.g. `metadata.organization`, `metadata.source_country`,
            `metadata.destination_countries`) are accepted. The special value `tags.details`
            preserves tag identity (id, slug) and strips only the enriched details. Unknown
            field names return 400.
          required: false
          schema:
            type: string
            example: "metadata.organization,metadata.city,metadata.rdns"
      responses:
        '200':
          description: OK - request successful.
          content:
            application/json:
              schema:
                oneOf:
                  - '$ref': '#/components/schemas/GNQLV3Response'
                  - '$ref': '#/components/schemas/QuickGNQLV3Response'
        '206':
          description: |
            Partial content - request partially successful.
            Due to plan limitations, your request only returned a subset of
            fields and/or data. Contact sales@greynoise.io to upgrade your
            plan and unlock full results.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/GNQLV3Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
  /v3/noise/ips/{ip}/timeline:
    parameters:
      - in: path
        name: ip
        description: |
          IPv4 address to look up Noise time series activity timeline for
        schema:
          type: string
          example: 36.32.2.102
        required: true
      - in: query
        name: days
        description: Number of days to show data for
        schema:
          type: string
          example: "7"
          default: "1"
        required: false
      - in: query
        name: field
        description: Field over which to show activity breakdown
        schema:
          type: string
          enum:
            - destination_port
            - http_path
            - http_user_agent
            - source_asn
            - source_org
            - source_rdns
            - tag_ids
            - classification
          example: classification
          default: classification
        required: true
      - in: query
        name: granularity
        description: |
          Granularity of activity date ranges. This can be in hours (e.g. Xh)
          or days (Xd).
          Valid hours are between 1 and 24. Valid days are between 1 and 90.
        schema:
          type: string
          example: 8h
          default: 1d
        required: false
      - '$ref': '#/components/parameters/workspaceLabels'
    get:
      operationId: getIPTimelineFieldSummary
      tags:
        - IP Timeline
      summary: IP Timeline Field Summary
      description: |
        Retrieve an IP address' summary of noise activity for a specific field.

        _License: This endpoint requires an additional subscription
        license to use._
      responses:
        '200':
          description: Success - returns activity data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPTimelineResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /v3/tags:
    get:
      operationId: listTags
      tags:
        - Tags
      summary: List Tags
      description: |
        Retrieve a list of tags with their metadata. Supports filtering by name, slug, and CVE.

        This endpoint returns tag information including ID, name, slug, category, intention,
        description, references, CVEs, and related tags.
      parameters:
        - in: query
          name: name
          description: Filter tags by name (partial match)
          required: false
          schema:
            type: string
            example: Mirai
        - in: query
          name: slug
          description: Filter tags by slug (exact match)
          required: false
          schema:
            type: string
            example: mirai
        - in: query
          name: cve
          description: Filter tags by associated CVE
          required: false
          schema:
            type: string
            example: CVE-2020-1234
      responses:
        '200':
          description: OK - request successful.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/TagsMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /v3/cves:
    post:
      operationId: bulkCVELookup
      tags:
        - CVE
      summary: Bulk CVE Lookup
      description: |
        Retrieve information about multiple CVEs in a single request. Supports up to 10,000 CVEs per request.

        This endpoint requires a business email address and appropriate entitlements.
        Response type depends on user entitlements (minimal, basic, or advanced).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cves
              properties:
                cves:
                  type: array
                  items:
                    type: string
                    pattern: '^CVE-\d{4}-\d+$'
                  description: Array of CVE IDs to lookup
                  example:
                    - CVE-2024-12345
                    - CVE-2023-45678
                  maxItems: 10000
      responses:
        '200':
          description: OK - request successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - '$ref': '#/components/schemas/CVEAdvancedResponse'
                    - '$ref': '#/components/schemas/CVEBasicResponse'
                    - '$ref': '#/components/schemas/CVEMinimalResponse'
        '400':
          description: |
            Bad request - invalid CVE format or too many CVEs requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Maximum number of CVEs per request is 10000"
        '403':
          description: |
            Forbidden - bulk CVE search requires a business email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Bulk CVE search is only available to users with a business email address. Sign up with your work email (e.g., you@company.com) to continue."
        '429':
          description: Too many requests. You've hit the rate-limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /ping:
    get:
      operationId: ping
      tags:
        - Utility
      summary: Ping
      description: |
        Provides a simple endpoint to check GreyNoise status and GreyNoise
        API access
      responses:
        '200':
          description: Ping successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong
                  expiration:
                    type: string
                    description: API key expiration date
                    example: "2026-12-31"
                  offering:
                    type: string
                    description: Compatibility offering value. Currently always enterprise for authenticated requests.
                    example: enterprise
                  address:
                    type: string
                    description: Client IP address
                    example: "3.215.138.152"
                  plan:
                    type: string
                    description: Active subscription plan name
                    example: Elite
                  modules:
                    type: string
                    description: Comma-separated list of active add-on module names
                    example: "Hunt,Vulnerability Prioritization"
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/cve/{cve_id}:
    get:
      operationId: getCVE
      tags:
        - CVE
      summary: Retrieve CVE Information
      description: Retrieve details about a specific Common Vulnerabilities and Exposures (CVE).
      parameters:
        - name: cve_id
          in: path
          description: The CVE ID to query (e.g., CVE-2024-12345)
          required: true
          schema:
            type: string
            pattern: '^CVE-\d{4}-\d+$'
      responses:
        '200':
          description: Successful response with CVE details based on entitlements.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CVEAdvancedResponse'
                  - $ref: '#/components/schemas/CVEBasicResponse'
                  - $ref: '#/components/schemas/CVEMinimalResponse'
        '400':
          description: Invalid CVE ID format or missing CVE ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "bad query: invalid CVE format"
        '404':
          description: CVE not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "CVE not found"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "internal server error"
  /v3/cves/list:
    get:
      operationId: listCVEs
      tags:
        - CVE
      summary: List CVEs
      description: |
        Return CVE records tracked by GreyNoise, ordered by publication date,
        last-update date, or CVSS score. Default cap is 100 records, configurable
        up to 1000 via the `limit` query parameter.

        This endpoint requires the `feature-search-cves-bulk` entitlement.
        Response payload is shaped according to the caller's CVE Insights tier
        (minimal, basic, or advanced).
      parameters:
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [published, updated, cvss]
            default: published
          description: Field to sort by.
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [desc, asc]
            default: desc
          description: Sort direction.
        - in: query
          name: exploitable_only
          required: false
          schema:
            type: boolean
            default: false
          description: When true, restrict to CVEs with attack_vector="Network".
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Maximum number of CVE records to return.
      responses:
        '200':
          description: OK - request successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cves:
                    type: array
                    items:
                      oneOf:
                        - '$ref': '#/components/schemas/CVEAdvancedResponse'
                        - '$ref': '#/components/schemas/CVEBasicResponse'
                        - '$ref': '#/components/schemas/CVEMinimalResponse'
                  generated_at:
                    type: string
                    format: date-time
                    description: Timestamp when the response was produced.
        '400':
          description: Bad request — unknown sort/order, bad limit, or invalid exploitable_only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden — caller lacks the bulk CVE search entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /v3/sessions:
    get:
      tags:
        - Sessions
      summary: Get Sessions
      operationId: getSessions
      description: |
        Returns a paginated list of network sessions matching the query criteria.
        Sessions represent individual network connections captured by GreyNoise sensors.
      parameters:
        - '$ref': '#/components/parameters/scope'
        - in: query
          name: start_time
          description: Start time for the query range (ISO 8601 format).
          required: true
          schema:
            type: string
            format: date-time
          example: "2025-01-01T00:00:00Z"
        - in: query
          name: end_time
          description: End time for the query range (ISO 8601 format).
          required: true
          schema:
            type: string
            format: date-time
          example: "2025-01-07T23:59:59Z"
        - in: query
          name: query
          description: Lucene query string to filter sessions.
          required: false
          schema:
            type: string
        - in: query
          name: page
          description: Page number for pagination.
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: page_size
          description: Number of results per page.
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
        - in: query
          name: sort_by
          description: Field to sort results by.
          required: false
          schema:
            type: string
            default: lastPacket
        - in: query
          name: sort_desc
          description: Whether to sort in descending order.
          required: false
          schema:
            type: string
            default: "true"
            enum: ["true", "false"]
      responses:
        '200':
          description: OK - request successful.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/SessionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
        '500':
          $ref: '#/components/responses/UnexpectedError'
