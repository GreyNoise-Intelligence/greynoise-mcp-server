              schema:
                $ref: '#/components/schemas/Error'
  /v3/articles:
    get:
      tags:
        - Threat Briefs
      summary: List Articles
      operationId: listArticles
      description: |
        Returns a paginated list of published articles (Threat Briefs). Supports
        filtering by category, search term, and pagination parameters.
      parameters:
        - in: query
          name: page
          description: Page number for pagination (1-indexed).
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: size
          description: Number of articles per page.
          required: false
          schema:
            type: integer
        - in: query
          name: search
          description: Case-insensitive search across title, subtitle, and description.
          required: false
          schema:
            type: string
        - in: query
          name: category
          description: Filter articles by category value.
          required: false
          schema:
            type: string
        - in: query
          name: sort_by
          description: Field to sort results by.
          required: false
          schema:
            type: string
            default: published_at
        - in: query
          name: sort_desc
          description: Sort in descending order. Set to `false` for ascending.
          required: false
          schema:
            type: string
            default: "true"
            enum: ["true", "false"]
      responses:
        '200':
          description: A paginated list of published articles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListArticlesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /v3/articles/categories:
    get:
      tags:
        - Threat Briefs
      summary: List Categories
      operationId: listArticleCategories
      description: |
        Returns the list of available article categories.
      responses:
        '200':
          description: List of article categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /v3/articles/{id}:
    get:
      tags:
        - Threat Briefs
      summary: Get Article
      operationId: getArticle
      description: |
        Returns a single published article by its ID.
      parameters:
        - in: path
          name: id
          required: true
          description: Unique article identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/ExceededLimit'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /v3/articles/rss-token:
    get:
      tags:
        - Threat Briefs
      summary: Get RSS Feed URL
      operationId: getRSSFeedToken
      description: |
        Returns the calling workspace's private RSS feed URL, issuing one on first
        access if the workspace does not have one yet, so `feed_url` is always
        populated on success. Requires an entitlement granting access beyond the
        public `community` category.
      responses:
        '200':
          description: The workspace's RSS feed URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RSSFeedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
        '500':
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags:
        - Threat Briefs
      summary: Generate RSS Feed URL
      operationId: generateRSSFeedToken
      description: |
        Rotates the calling workspace's private RSS feed URL: issues a new URL and
        invalidates the previous one. Use this to revoke a leaked feed URL. Requires
        an entitlement granting access beyond the public `community` category.
      responses:
        '200':
          description: The workspace's RSS feed URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RSSFeedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /v3/articles/rss:
    get:
      tags:
        - Threat Briefs
      summary: Public RSS Feed
      operationId: getPublicRSSFeed
      description: |
        Returns an RSS 2.0 feed of published community Threat Briefs. This feed is
        public and unauthenticated, and exposes only the `community` category.
      security: []
      responses:
        '200':
          description: RSS 2.0 XML feed.
          content:
            application/rss+xml:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /v3/articles/rss/{token}:
    get:
      tags:
        - Threat Briefs
      summary: Private RSS Feed
      operationId: getPrivateRSSFeed
      description: |
        Returns a workspace's entitlement-filtered RSS 2.0 feed. The feed URL
        (obtained from `GET`/`POST /v3/articles/rss-token`) embeds an opaque token
        that is the only credential, so RSS readers need no API key. The feed
        contents follow the workspace's live entitlements on every fetch.
      security: []
      parameters:
        - in: path
          name: token
          required: true
          description: The opaque feed token from the issued feed URL.
          schema:
            type: string
      responses:
        '200':
          description: RSS 2.0 XML feed.
          content:
            application/rss+xml:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
servers:
  - url: https://api.greynoise.io
  - url: http://api.greynoise.io
components:
  securitySchemes:
    APIKeyHeaderAuth:
      type: apiKey
      in: header
      name: key
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: IP not found
    BadRequest:
      description: |
        Bad request - request syntax is invalid for the specified endpoint.
        Verify request syntax and try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Invalid parameter
    PsychicBadRequest:
      description: |
        Bad request - request syntax is invalid for the Psychic download endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PsychicError'
          examples:
            missingModel:
              value:
                error: model is required
            invalidDate:
              value:
                error: date must be latest or YYYY-MM-DD
    Unauthorized:
      description: Unauthorized. Please check your API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthorized
    Forbidden:
      description: |
        Forbidden - request is not authorized due to an invalid API key or plan limitations.
        If due to plan limitations, contact sales@greynoise.io to upgrade your plan and unlock full results.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Forbidden
    PsychicForbidden:
      description: |
        Forbidden - request is not authorized due to API-key access, Psychic entitlement, or Psychic lookback limitations.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/PsychicError'
              - $ref: '#/components/schemas/Error'
          examples:
            missingEntitlement:
              value:
                error: feature not allowed
            lookbackExceeded:
              value:
                error: lookback date exceeds entitlement
    PsychicNotFound:
      description: Psychic model file not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PsychicError'
          example:
            error: not found
    PsychicRequestEntityTooLarge:
      description: Request body too large. BI request-body inspection is limited to 32 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PsychicError'
          example:
            error: request body too large
    PsychicTooManyRequests:
      description: |
        Too many requests - either too many concurrent Psychic range downloads are
        being generated, or the requested Psychic model meter has no remaining
        usage. Retry later for concurrent-generation limits, or contact
        sales@greynoise.io to adjust model usage entitlements.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PsychicError'
          examples:
            activeRangeGenerations:
              value:
                error: too many active range generations
            usageLimitExceeded:
              value:
                error: usage limit exceeded
    PsychicUnexpectedError:
      description: Unexpected Psychic download error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PsychicError'
          example:
            error: internal error
    UnexpectedError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Encountered error while performing request
    ExceededLimit:
      description: Too many requests. You've hit the rate-limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: You've hit the rate limit for this endpoint.
  parameters:
    ip:
      name: ip
      in: path
      description: IP address to query
      required: true
      schema:
        type: string
    query:
      name: query
      in: query
      description: GNQL query string
      required: true
      schema:
        type: string
    scope:
      name: scope
      in: query
      description: |
        Controls the data scope for the query.
        - `workspace`: Query data from the current workspace (default). Requires the Sensors entitlement.
        - `demo`: Query demo/sample data. Requires the Swarm entitlement. Not available on export endpoints.
      required: false
      schema:
        type: string
        default: workspace
        enum: [workspace, demo]
    workspaceLabels:
      name: workspace_labels
      in: query
      description: |
        Comma-separated list of dataset scopes to include in the query.
        When omitted, only the default GreyNoise global dataset is queried.

        Allowed values:
        - `greynoise`: GreyNoise's global dataset.
        - `community`: Aggregated community-contributed data.
        - `personal`: The authenticated caller's own workspace data.
          Requires an authenticated workspace.

        Enforcement varies by endpoint; see each operation's response codes:
        - `GET /v3/ip/{ip}` and `POST /v3/ip` return `403 Forbidden` when any
          value is supplied without the Community Dataset entitlement. Values
          are not validated server-side; unrecognized values yield empty
          results rather than an error.
        - `GET /v3/noise/ips/{ip}/timeline` returns `400 Bad Request` for
          unrecognized values and for `personal` without an authenticated
          workspace. The Community Dataset entitlement is not enforced on
          this endpoint.
      required: false
      schema:
        type: string
        example: greynoise,community
    workspaceId:
      name: workspace_id
      in: path
      description: Workspace UUID.
      required: true
      schema:
        type: string
        format: uuid
    blocklistId:
      name: blocklist_id
      in: path
      description: Blocklist UUID.
      required: true
      schema:
        type: string
        format: uuid
    bsiDate:
      name: date
      in: query
      description: |
        Snapshot date for the requested stats. `now` (the default) reads
        current data from the BSI IP database. A value of the form
        `YYYY-MM-DD` reads historical data for that day; returns
        `404` if no data is available.
      required: false
      schema:
        type: string
        default: now
        example: 2026-05-12
  requestBodies:
    MultiIpRequest:
      required: true
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/MultiIpRequest'
      description: Ipv4 addresses to perform noise lookup.
  schemas:
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique article identifier.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        title:
          type: string
          description: Article title.
          example: "Understanding Internet Background Noise"
        subtitle:
          type: string
          description: Article subtitle.
          example: "A deep dive into scan traffic"
        description:
          type: string
          description: Article description or body text.
        category:
          $ref: '#/components/schemas/ArticleCategory'
        author:
          type: string
          description: Name of the article author.
          example: "GreyNoise Research"
        s3_url:
          type: string
          description: URL to the article PDF file.
        thumbnail_url:
          type: string
          description: URL to the article thumbnail image.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the article was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the article was last updated.
        published_at:
          type: string
          format: date-time
          description: Timestamp when the article was published. Omitted if unpublished.
        is_published:
          type: boolean
          description: Whether the article is currently published.
    ArticleCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique category identifier.
        label:
          type: string
          description: Display label for the category.
          example: "Threat Intelligence"
        value:
          type: string
          description: Machine-readable category value.
          example: "threat-intelligence"
        color:
          type: string
          description: Hex color code for the category.
          example: "#FF5733"
    ListArticlesResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/ArticleListMetadata'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Article'
    ArticleListMetadata:
      type: object
      properties:
        total_results:
          type: integer
          description: Total number of articles matching the query.
          example: 42
        current_page:
          type: integer
          description: Current page number.
          example: 1
        count:
          type: integer
          description: Number of articles returned in this page.
          example: 10
    RSSFeedResponse:
      type: object
      properties:
        feed_url:
          type: string
          description: |
            The workspace's private RSS feed URL. Treat this URL as a secret;
            anyone with it can read the workspace's entitlement-filtered feed.
          example: "https://api.greynoise.io/v3/articles/rss/uJ8x9...redacted"
        public_feed_url:
          type: string
          description: The public community RSS feed URL.
          example: "https://api.greynoise.io/v3/articles/rss"
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    PsychicError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    PsychicDownloadDate:
      type: string
      description: "`latest` or a date in `YYYY-MM-DD` format. Future dates are rejected."
      example: latest
    PsychicModel:
      type: string
      description: Psychic model selector. Accepted selectors identify models 1, 2, 3, and 4.
      enum:
        - '1'
        - '2'
        - '3'
        - '4'
        - m1
        - m2
        - m3
        - m4
        - model1
        - model2
        - model3
        - model4
      example: model2
    PsychicDownloadFormat:
      type: string
      description: Download file format. Defaults to `bin`.
      enum:
        - bin
        - mmdb
      default: bin
      example: bin
    PsychicDownloadRequest:
      type: object
      required:
        - model
      properties:
        model:
          $ref: '#/components/schemas/PsychicModel'
        date:
          allOf:
            - $ref: '#/components/schemas/PsychicDownloadDate'
          description: When omitted, the latest daily model is used. Model 4 supports only omitted date or `latest`.
        start_date:
          allOf:
            - $ref: '#/components/schemas/PsychicDownloadDate'
          description: Inclusive range start date. Must be sent with `end_date`, cannot be combined with `date`, and is supported only for models 1, 2, and 3.
        end_date:
          allOf:
            - $ref: '#/components/schemas/PsychicDownloadDate'
          description: Inclusive range end date. Must be sent with `start_date`, cannot be combined with `date`, and ranges cannot exceed 30 days.
        format:
          $ref: '#/components/schemas/PsychicDownloadFormat'
    PsychicSnapshotRequest:
      type: object
      required:
        - model
      properties:
        model:
          $ref: '#/components/schemas/PsychicModel'
        days:
          type: integer
          description: Required for models 1, 2, and 3. Must be omitted for model 4.
          enum:
            - 7
            - 30
          example: 30
        format:
          $ref: '#/components/schemas/PsychicDownloadFormat'
      additionalProperties: false
      description: |
        Snapshot downloads use precomputed artifacts only. Models 1, 2, and 3
        require `days` with a value of `7` or `30`. Model 4 accepts `model`
        and optional `format` only; sending `days`, `date`, `start_date`, or
        `end_date` returns `400`.
    MetadataV3:
      properties:
        mobile:
          type: boolean
          description: Defines if the IP is part of a known cellular network.
          example: false
        source_country:
          type: string
          description: Country where the IP address is registered or operates.
          example: United States
        source_country_code:
          type: string
          description: Country code of the IP address based on ISO 3166-1 alpha-2.
          example: US
        source_city:
          type: string
          description: The city where the device is geographically located.
          example: Seattle
        region:
          type: string
          description: The region where the device is geographically located.
          example: Seattle
        organization:
          type: string
          description: The name of organization that owns the IP address.
          example: DigitalOcean, LLC
        rdns:
          type: string
          description: The reverse DNS pointer.
          example: crawl-66-249-79-17.googlebot.com
        asn:
          type: string
          description: The autonomous system identification number.
          example: AS521
        category:
          type: string
          description: The subset of network types the IP address belongs to.
          enum:
            - isp
            - business
            - hosting
            - mobile
            - education
          example: education
        os:
          type: string
          description: An approximate guess of the operating system of the device, based on the TCP stack fingerprint.
          example: Windows 7/8
        destination_countries:
          type: array
          items:
            type: string
            description: |
              The full name or country code where GreyNoise sensor
              is physically located.
            example: Germany
        destination_country_codes:
          type: array
          items:
            type: string
            description: |
              The country codes where GreyNoise sensor is
              physically located.
            example: Germany
        destination_cities:
          type: array
          items:
            type: string
            description: |
              The city where the GreyNoise sensor is geographically located.
            example: Berlin
        destination_asns:
          type: array
          items:
            type: string
            description: |
              The ASN associated with the destination IP address.
            example: AS1234
        single_destination:
          type: boolean
          description: |
            A Boolean parameter indicating whether the source IP address
            has only been observed in a single destination country.
          example: true
        carrier:
          type: string
          description: |
            The Internet Service Provider (ISP) or telecommunications
            carrier associated with the source IP address.
          example: AIS
        datacenter:
          type: string
          description: |
            The datacenter or hosting provider from which the activity originates.
            This could indicate the use of cloud services,
            managed hosting, or enterprise datacenter infrastructure.
          example: us-west-1
        domain:
          type: string
          description: |
            The domain name associated with the source IP address.
          example: example.com
        rdns_parent:
          type: string
          description: |
            The parent domain retrieved through reverse DNS (RDNS)
            lookup of the source IP address.
          example: example.com
        rdns_validated:
          type: boolean
          description: |
            A validation status that confirms whether the reverse DNS (RDNS)
            record correctly maps to the source domain.
          example: true
        latitude:
          type: number
          description: |
            The geographic latitude of the source IP address.
          example: 37.7749
        longitude:
          type: number
          description: |
            The geographic longitude of the source IP address.
          example: -122.4194
        sensor_count:
          type: integer
          description: |
            Number of sensors with events observed.
          example: 10
        sensor_hits:
          type: integer
          description: |
            Number of scanning events observed.
          example: 10
    GNQLIPContextV3:
      properties:
        ip:
          type: string
          description: IP address that the information is about.
          example: 71.6.135.131
        internet_scanner_intelligence:
          '$ref': '#/components/schemas/InternetScannerIntelligence'
        business_service_intelligence:
          '$ref': '#/components/schemas/BusinessServiceIntelligence'
    InternetScannerIntelligence:
      properties:
        ip:
          type: string
          description: IP address that the information is about.
          example: 71.6.135.131
        seen:
          type: boolean
          description: Whether or not the IP address has been observed by the GreyNoise sensor network.
          example: true
        classification:
          type: string
          description: The classification of the IP address, either "benign", "malicious", or "unknown", based on the activity observed by GreyNoise.
          enum:
            - benign
            - malicious
            - unknown
          example: benign
        first_seen:
          type: string
          description: The earliest date GreyNoise observed any activity from this IP.
          format: date
          example: '2018-01-28'
        last_seen:
          type: string
          description: The most recent date GreyNoise observed any activity from this IP.
          format: date
          example: '2018-02-28'
        last_seen_timestamp:
          type: string
          description: The timestamp of the last observed activity from this IP.
          format: date-time
          example: '2025-01-15T12:30:45Z'
        found:
          type: boolean
          description: Indicates if the IP was observed scanning the GreyNoise sensor network. Also referred to as 'noise'.
          example: true
        actor:
          type: string
          description: The overt actor this IP is associated with.
          example: Shodan.io
        spoofable:
          type: boolean
          description: This IP address has been opportunistically scanning the Internet, however has failed to complete a full TCP connection. Any reported activity could be spoofed.
          example: true
        cves:
          type: array
          items:
            type: string
          description: A list of CVEs associate with this IP.
          example:
            - CVE-2020-1234
            - CVE-2021-2345
        tor:
          type: boolean
          description: Whether or not the device is a known Tor exit node.
          example: false
        vpn:
          type: boolean
          description: This IP is associated with a VPN service. Activity, malicious or otherwise, should not be attributed to the VPN service provider.
          example: true
        vpn_service:
          type: string
          description: Name of associated VPN Service.
          example: IPVANISH_VPN
        metadata:
          '$ref': '#/components/schemas/MetadataV3'
        tags:
          '$ref': '#/components/schemas/IPResponseV3Tags'
        raw_data:
          type: object
          description: Raw data observed directly by GreyNoise.
          properties:
            scan:
              type: array
              items:
                type: object
                properties:
                  port:
                    type: integer
                    description: Port number
                    example: 80
                  protocol:
                    type: string
                    description: Protocol
                    example: TCP
            ja3:
              type: array
              items:
                type: object
                properties:
                  fingerprint:
                    type: string
                    example: c3a6cf0bf2e690ac8e1ecf6081f17a50
                    description: JA3 hash fingerprint string
                  port:
                    type: integer
                    example: 443
                    description: TCP port connection that the SSL/TLS communication occurred over
            hassh:
              type: array
              items:
                type: object
                properties:
                  fingerprint:
                    type: string
                    example: 51cba57125523ce4b9db67714a90bf6e
                    description: HASSH hash fingerprint string
                  port:
                    type: integer
                    example: 2222
                    description: |
                      TCP port connection where the HASSH hash was identified
            http:
              type: object
              properties:
                md5:
                  type: string
                  description: |
                    An MD5 hash of the body content. This compact,
                    unique representation of the data allows for quick
                    comparisons and deduplication of payloads without
                    storing the raw content.
                  example: 9764955b67107eeb9edfae76f429e783
                cookie_keys:
                  type: array
                  description: |
                    The keys or names of cookies exchanged in the communication.
                    These can reveal session identifiers, tracking mechanisms,
                    or other metadata used in web interactions,
                    providing clues about application behavior or vulnerabilities.
                  example:
                    - expremotekey
                  items:
                    type: string
                request_authorization:
                  type: array
                  description: |
                    The contents of the Authorization header in a request,
                    which can include credentials, tokens, or other authentication
                    information.
                  example:
                    - Bearer exampletoken
                    - Basic username:password
                  items:
                    type: string
                request_cookies:
                  type: array
                  description: |
                    Key-value pairs stored in cookies sent with an HTTP request.
                    These cookies often contain session identifiers, user preferences,
                    or tracking data, which can be analyzed to detect unauthorized
                    access or manipulation.
                  example:
                    - session_id=1234567890
                  items:
                    type: string
                request_header:
                  type: array
                  description: |
                    Request Headers are the keys (names) of HTTP headers
                    that a client sends to a server.
                  example:
                    - "Content-Type: application/json"
                    - "Accept: application/json"
                  items:
                    type: string
                method:
                  type: array
                  description: |
                    The HTTP method used in the request, such as GET, POST, PUT, or DELETE.
                    Analyzing methods can reveal the intent of the request,
                    such as retrieving or modifying resources,
                    and identify unexpected or suspicious activity.
                  example:
                    - GET
                    - POST
                    - PUT
                    - DELETE
                  items:
                    type: string
                request_origin:
                  type: array
                  description: |
                    Indicates the origin of the request,
                    typically used in cross-origin resource sharing (CORS)
                    to specify where the request originated.
                    This helps identify unauthorized or potentially
                    malicious cross-origin requests.
                  example:
                    - 111.111.1.1
                  items:
                    type: string
                host:
                  type: array
                  description: |
                    The host of the request, which can include the domain name
                    and port number. These values can provide insight into the services or
                    endpoints the actor may have been attempting to interact with.
                  example:
                    - example.com
                    - example.com:8080
                  items:
                    type: string
                uri:
                  type: array
                  items:
                    type: string
                    description: |
                      The URI of the request, which can include the path and query parameters.
                      This can provide insight into the specific resource or data being requested.
                path:
                  type: array
                  items:
                    type: string
                    description: Observed scanning activity traversed this web path.
                    example: '/robots.txt'
                useragent:
                  type: array
                  items:
                    type: string
                    description: Observed scanning activity used these user agents.
                    example: >
                      Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)

                ja4h:
                  type: array
                  items:
                    type: string
                    description: |
                      List of JA4H HTTP client fingerprints observed in network traffic from the IP.
                      JA4H captures characteristics of HTTP client behavior including method,
                      headers, and cookie fields, useful for identifying and tracking HTTP clients.
                  example:
                    - ge11cn060000_4e59edc1297a_4da5efaf0cbd
            tls:
              type: object
              properties:
                cipher:
                  type: string
                  description: |
                    The encryption algorithm or cipher suite used during the
                    secure communication. Identifying the cipher helps assess
                    the security of the connection, particularly in TLS/SSL traffic.
                  example: TLS_AES_128_GCM_SHA256
                ja4:
                  type: array
                  items:
                    type: string
                    description: |
                      List of JA4 TLS fingerprints observed in network traffic from the IP.
                      JA4 is a modern fingerprinting method that captures distinctive
                      characteristics of TLS client behavior,
                      useful for identifying and clustering malicious or anomalous clients.
                  example:
                    - t13d1516h2_8daaf6152771_02713d6af862
            ssh:
              type: object
              properties:
                key:
                  type: array
                  description: |
                    This is the SSH key used.
                  example:
                    - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC1234567890
                  items:
                    type: string
                ja4ssh:
                  type: array
                  items:
                    type: string
                    description: |
                      List of JA4SSH fingerprints observed in network traffic from the IP.
                      JA4SSH captures SSH traffic patterns including packet lengths and
                      directions, useful for identifying SSH client behavior and detecting
                      anomalous sessions.
                  example:
                    - c76s76_c71s59_c0s0
            tcp:
              type: object
              properties:
                ja4t:
                  type: array
                  items:
                    type: string
                    description: |
                      List of JA4T TCP fingerprints observed in network traffic from the IP.
                      JA4T captures TCP connection characteristics such as window size,
                      options, and MSS, useful for OS fingerprinting and identifying
                      network stacks.
                  example:
                    - 64240_2-1-3-1-1-4_1460_8
                ja4l:
                  type: string
                  description: |
                    JA4L light distance/latency fingerprint observed in network traffic
                    from the IP. Captures TCP TTL and window size characteristics, useful
                    for estimating client-server distance and identifying proxied
                    connections.
                  example: "1460_64"
            source:
              properties:
                bytes:
                  type: integer
                  description: |
                    The total amount of data transferred (in bytes) during the observed session or connection.
                  example: 1024
    BusinessServiceIntelligence:
      properties:
        found:
          type: boolean
          description: |
            Indicates if an IP is part of the RIOT dataset or not.
          example: true
        category:
          type: string
          description: |
            RIOT category the provider belongs to, identifying the type of service provided.
          example: hosting
        name:
          type: string
          description: |
            The name of the provider and/or service.
          example: example.com
        description:
          type: string
          description: |
            A description of the provider and what they do.
          example: example.com
        explanation:
          type: string
          description: |
            An explanation of the category type and what may be expected from this provider and category.
        last_updated:
          type: string
          description: |
            Date and time when this record was last updated from its source (format: YYYY-MM-DDTHH:MM:SSZ).
          example: '2025-01-15T12:30:45Z'
        reference:
          type: string
          description: |
            Reference URL for information about this provider and/or service.
          example: https://example.com
        trust_level:
          type: string
          description: |
            Trust level assigned to this IP/provider. One of:
              - "1" — high trust; broadly used legitimate provider where end-user attribution is high.
              - "2" — moderate trust; common business service infrastructure where end-user attribution is limited.
              - "3" — label only; cloud compute or bulk hosting provider with no inherent trust signal.
          example: "1"
