  /v3/sessions/export:
    get:
      tags:
        - Sessions
      summary: Export PCAP for Multiple Sessions
      operationId: exportSessionsPcap
      description: |
        Returns a PCAP file containing packets from sessions matching the query criteria.
        The response is a binary PCAP file suitable for analysis with tools like Wireshark.

        Not available when `scope=demo` (returns 403).
      parameters:
        - '$ref': '#/components/parameters/scope'
        - in: query
          name: start_time
          description: Start time for the query range (ISO 8601 format).
          required: true
          schema:
            type: string
            format: date-time
          example: "2025-01-01T00:00:00Z"
        - in: query
          name: end_time
          description: End time for the query range (ISO 8601 format).
          required: true
          schema:
            type: string
            format: date-time
          example: "2025-01-07T23:59:59Z"
        - in: query
          name: query
          description: Lucene query string to filter sessions.
          required: false
          schema:
            type: string
        - in: query
          name: mode
          description: |
            Export selection mode.
            - `page`: Export a single page of results (use with `page` and `page_size`). This is the default.
            - `all`: Export all sessions matching the query, up to `page_size` results.
          required: false
          schema:
            type: string
            default: page
            enum: [page, all]
        - in: query
          name: page
          description: Page number to export when `mode=page`.
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: page_size
          description: |
            Number of sessions per page when `mode=page`, or the maximum number of
            sessions to export when `mode=all`. The legacy `size` parameter is
            accepted as an alias.
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - in: query
          name: sort_by
          description: Field to sort results by.
          required: false
          schema:
            type: string
            default: lastPacket
        - in: query
          name: sort_desc
          description: Whether to sort in descending order.
          required: false
          schema:
