  /v3/bsi/download:
    get:
      tags:
        - Business Service Intelligence
      summary: BSI Bulk Data Download
      operationId: getBSIDownload
      description: |
        Returns the newest BSI bulk-data file for the requested date as a
        gzipped, newline-delimited JSON (`.json.gz`) stream. Each line is a
        single record with provider metadata (`name`, `category`,
        `trust_level`, etc.), a CIDR (`ip_cidr`), and a scan timestamp.

        Use `date=now` for today's snapshot (resolved server-side to today's
        UTC date) or `date=YYYY-MM-DD` for a specific historical partition.

        _License: This endpoint requires an additional subscription
        license to use._
      parameters:
        - $ref: '#/components/parameters/bsiDate'
      responses:
        '200':
          description: OK — gzipped JSONL stream of the BSI bulk-data file for the requested date.
          headers:
            Content-Disposition:
              description: |
                Suggested filename for saving the response. The date in the
                filename reflects the resolved date (e.g. `now` resolves to
                today's UTC date).
              schema:
                type: string
                example: attachment; filename="riot-bulk-2026-05-14.json.gz"
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /v1/psychic:
    post:
      tags:
        - Psychic
      summary: Psychic Model Download
      operationId: postPsychicModelDownload
      description: |
        Downloads a Psychic model file. The request body selects the model
        (`1`, `2`, `3`, `4`, `m1`, `m2`, `m3`, `m4`, `model1`, `model2`,
        `model3`, or `model4`).
        Models 1, 2, and 3 may set `date` to `latest` or a `YYYY-MM-DD`
        date. When `date` is omitted, the latest daily model is used. Models 1,
        2, and 3 may also request an inclusive date range with `start_date` and
        `end_date`; ranges are limited to 30 days and return one combined
        download.
        Model 4 downloads the latest model 4 artifact. Model 4 may omit
        `date` or set `date` to `latest`, but does not support historical
        dates, `start_date`, or `end_date`.
        Set `format` to `mmdb` to download a MaxMind DB file. When `format`
        is omitted, the binary model format is used.

        _License: This endpoint requires the Psychic model meter entitlement
        for the requested model. Historical dates also require that model's
        Psychic lookback-days entitlement to cover the requested date or range
        start date._
      requestBody:
        required: true
        description: Psychic model selector, optional daily model date or range, and optional file format.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PsychicDownloadRequest'
      responses:
        '200':
          description: OK - binary Psychic model file.
          headers:
            Content-Disposition:
              description: Suggested filename for saving the response.
              schema:
                type: string
                example: attachment; filename="m2-2026-06-04.bin"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/vnd.maxmind.maxmind-db:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/PsychicBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PsychicForbidden'
        '404':
          $ref: '#/components/responses/PsychicNotFound'
        '413':
          $ref: '#/components/responses/PsychicRequestEntityTooLarge'
        '429':
          $ref: '#/components/responses/PsychicTooManyRequests'
        '500':
          $ref: '#/components/responses/PsychicUnexpectedError'
  /v1/psychic/snapshots:
    post:
      tags:
        - Psychic
      summary: Psychic Snapshot Download
      operationId: postPsychicSnapshotDownload
      description: |
        Downloads a precomputed Psychic snapshot artifact. Snapshots are fixed,
        already-materialized files for common rolling windows and latest model 4.
        This endpoint does not generate missing ranges or convert missing MMDBs.

        Models 1, 2, and 3 require `days` and currently support only `7` or
        `30`. Model 4 downloads the latest model 4 snapshot and rejects `days`.
        `date`, `start_date`, and `end_date` are not supported on this endpoint.

        A successful response streams the snapshot file. Transfer time still
        depends on file size and client connection speed. A `404` response means
        the requested snapshot artifact is not available.

        _License: This endpoint requires the Psychic model meter entitlement
        for the requested model. Models 1, 2, and 3 also require that model's
        Psychic lookback-days entitlement to cover the resolved snapshot start
        date._
      requestBody:
        required: true
        description: Psychic snapshot selector and optional file format.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PsychicSnapshotRequest'
            examples:
              model3SevenDayBin:
                summary: Model 3 seven-day binary snapshot
                value:
                  model: '3'
                  days: 7
                  format: bin
              model3ThirtyDayMMDB:
                summary: Model 3 thirty-day MMDB snapshot
                value:
                  model: '3'
                  days: 30
                  format: mmdb
              model4MMDB:
                summary: Latest model 4 MMDB snapshot
                value:
                  model: '4'
                  format: mmdb
      responses:
        '200':
          description: OK - binary Psychic snapshot file.
          headers:
            Content-Disposition:
              description: Suggested filename for saving the response.
              schema:
                type: string
                example: attachment; filename="m3-2026-06-17-to-2026-06-23.mmdb"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/vnd.maxmind.maxmind-db:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/PsychicBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PsychicForbidden'
        '404':
          $ref: '#/components/responses/PsychicNotFound'
        '413':
          $ref: '#/components/responses/PsychicRequestEntityTooLarge'
        '429':
          $ref: '#/components/responses/PsychicTooManyRequests'
        '500':
          $ref: '#/components/responses/PsychicUnexpectedError'
  /v3/bsi/lookup:
    get:
      tags:
        - Business Service Intelligence
      summary: BSI Single-IP Lookup
      operationId: getBSILookup
      description: |
        Returns every BSI provider whose CIDR(s) contain the queried IPv4
        address, ordered by ascending precedence (lower precedence = higher
        priority). An empty `matches` array means the IP is not in BSI.

        IPv6 addresses are rejected with HTTP 400. Lookups are served from
        an in-memory index that refreshes from the daily bulk-data
        partition; staleness may be up to ~30 minutes after a partition
        rolls.

        _License: This endpoint requires an additional subscription
        license to use._
      parameters:
        - name: ip
          in: query
          description: The IPv4 address to look up.
          required: true
          schema:
            type: string
            example: 8.8.8.8
      responses:
        '200':
          description: OK — request successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BSILookupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Service Unavailable — BSI index not yet built.
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /v3/bsi/bulk:
    post:
      tags:
        - Business Service Intelligence
      summary: BSI Bulk IP Lookup
      operationId: getBSIBulkLookup
      description: |
        Accepts up to 1,000 IPv4 addresses and returns BSI provider matches
        for each, preserving request order. A given IP's `matches` entry is
        an empty array if it is not in BSI. IPv6 addresses are rejected
        with HTTP 400 (the whole request fails; callers should re-issue
        without the offending entry).

        _License: This endpoint requires an additional subscription
        license to use._
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BSIBulkRequest'
      responses:
        '200':
          description: OK — request successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BSIBulkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Service Unavailable — BSI index not yet built.
        '500':
          $ref: '#/components/responses/UnexpectedError'
